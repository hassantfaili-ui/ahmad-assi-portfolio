name: Deploy to GitHub Pages

# Builds the static site and publishes it to Pages.
# The build is plain `npm run build`, which is deliberately the same command used
# locally: the Keystatic editor is mounted only when npm_lifecycle_event is
# "dev", so CI produces a purely static site with no admin routes.
#
# MANUAL ONLY. Netlify is the live host now, so this no longer runs on push: two
# hosts building the same commit means two URLs for one site, which splits search
# ranking and gives two places to check when something looks wrong. The workflow
# is kept rather than deleted so Pages can be brought back with one click if
# Netlify is ever dropped.
#
# Note the Pages site stays online at its last deployed state until Pages itself
# is turned off in the repository settings.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
