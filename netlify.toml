# Netlify build.
#
# This is the only host now: GitHub Pages is retired and the base path that went
# with it is gone, so the site is served from the root here and in development.
# Nothing here has to change when a custom domain is attached, since Netlify
# updates URL to the domain and astro.config.mjs follows it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires >=22.12.0. Do not lower this: Netlify's default build image
  # ships Node 20, which fails with "Node.js v20.x is not supported by Astro"
  # before it emits a single page. The requirement is also declared in
  # package.json engines so it is visible without reading this file.
  NODE_VERSION = "22"

# Media is cached for an hour and then revalidated, deliberately not "immutable".
#
# Immutable was wrong once Ahmad started editing the site. It tells a browser not
# to so much as ask about the file for a year, and Keystatic writes an uploaded
# photo under its own filename. So replacing a render with a better version
# exported under the same name would change nothing for anyone who had already
# visited, for a year, with no way for him to tell why. The failure looks exactly
# like the edit not having saved.
#
# The hour covers a browsing session completely, so nothing is refetched while
# someone is actually looking around. After that Netlify answers with a 304 from
# its ETag unless the file really did change, which costs a few hundred bytes and
# keeps the films, the largest things here, from being downloaded twice.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro emits hashed filenames under _astro, so those are safe to pin too.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
